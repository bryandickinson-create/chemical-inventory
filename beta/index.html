<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moved — Dickinson Group Inventory</title>
    <link rel="canonical" href="../">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            background: #f3f4f6;
            color: #111827;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f1116; color: #f4f6fa; }
        }
        a { color: #2563eb; font-weight: 600; }
        p { line-height: 1.5; max-width: 30rem; }
    </style>
</head>
<body>
    <div>
        <h1>The beta is now the main app</h1>
        <p>
            Redirecting you to the real inventory app.
            If nothing happens, <a href="../">tap here</a>.
        </p>
        <p><small>You can delete the "Inventory Beta" icon from your home screen.</small></p>
    </div>

    <script>
        // Tear down anything the beta installed on this device before leaving,
        // so a stale service worker can't keep serving the old build.
        (async () => {
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(
                        regs.filter(r => r.scope.includes('/beta/')).map(r => r.unregister())
                    );
                }
                if (window.caches) {
                    const names = await caches.keys();
                    await Promise.all(
                        names.filter(n => n.startsWith('chem-inv-beta')).map(n => caches.delete(n))
                    );
                }
            } catch (e) {
                console.warn('Beta cleanup failed:', e);
            }
            window.location.replace('../');
        })();
    </script>
</body>
</html>
